openapi: 3.0.3
info:
  title: Identity API
  description: Authentication, accounts, and user preferences for Adjutant
  version: 0.1.0
servers:
  - url: http://localhost:8082
    description: Local development
tags:
  - name: Authentication
  - name: Apps
  - name: Users
  - name: Health
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/DuplicateEntry'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access and refresh tokens
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Refresh token revoked successfully
        '400':
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      tags: [Users]
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /apps:
    get:
      tags: [Apps]
      summary: Fetch all available apps
      operationId: getApps
      responses:
        '200':
          description: Available apps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /users/me/preferences:
    get:
      tags: [Users]
      summary: Get the authenticated user's preferences
      operationId: getCurrentUserPreferences
      responses:
        '200':
          description: Current app preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
    put:
      tags: [Users]
      summary: Update the authenticated user's preferences
      operationId: updateCurrentUserPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserPreferencesRequest'
      responses:
        '200':
          description: Updated app preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferencesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '404':
          description: App was not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /actuator/health:
    get:
      tags: [Health]
      summary: Check application health
      operationId: health
      security: []
      responses:
        '200':
          description: Application health status
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    AuthenticationFailed:
      description: Authentication failed or access token is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    DuplicateEntry:
      description: Resource already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    AppResponse:
      type: object
      required: [appId, name, baseUrl]
      properties:
        appId:
          type: string
        name:
          type: string
        baseUrl:
          type: string
          format: uri
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 72
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
    UpdateUserPreferencesRequest:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppPreferenceUpdate'
    AppPreferenceUpdate:
      type: object
      required: [appId, enabled]
      properties:
        appId:
          type: string
          minLength: 1
        enabled:
          type: boolean
    AuthResponse:
      type: object
      required: [accessToken, refreshToken, expiresInSeconds, tokenType, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    UserPreferencesResponse:
      type: object
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: '#/components/schemas/AppPreferenceResponse'
    AppPreferenceResponse:
      type: object
      required: [appId, enabled]
      properties:
        appId:
          type: string
        enabled:
          type: boolean
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: UP
    ProblemDetail:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        timestamp:
          type: string
          format: date-time
