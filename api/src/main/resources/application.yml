spring:
  application:
    name: identity
  datasource:
    url: jdbc:mysql://localhost:3306/identity?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: identity
    password: identity
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

identity:
  jwt:
    secret: ${IDENTITY_JWT_SECRET:dev-only-change-me-use-at-least-32-characters-long-secret}
    issuer: adjutant-identity
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 604800
  apps:
    known:
      - bingable
      - bookworm
      - gamify
      - routine
      - glutton

logging:
  level:
    com.identity: INFO
